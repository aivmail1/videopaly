# GitHub Actions：云端构建 APK（无需本地 Linux）
# 自适应：仓库根即本工程内容，或仓库根含 android_app/ 子目录，均可。
# 触发：push 到 main，或在 Actions 页手动 Run workflow。
#
# 版本策略（2026-11 调整）：
# - actions 升级到 v5（v4 已弃用告警）
# - 固定 buildozer==1.5.0 + Cython 0.29.x：python-for-android 2023 与
#   Cython 3 不兼容，"pip install buildozer cython" 拉到 Cython 3 会
#   早期立刻失败（正是 50 秒即挂的典型症状）

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install buildozer (pinned)
        run: pip install "buildozer==1.5.0" "cython<3"

      - name: Show environment
        run: |
          python -V
          pip show buildozer Cython | head -20

      - name: Build debug APK
        run: |
          if [ -f android_app/buildozer.spec ]; then cd android_app; fi
          ls -la
          buildozer version
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: videoplayerdl-apk
          path: |
            android_app/bin/*.apk
            bin/*.apk
          if-no-files-found: error
