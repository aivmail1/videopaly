# GitHub Actions：云端构建 APK（无需本地 Linux）
# 自适应：仓库根即本工程内容，或仓库根含 android_app/ 子目录，均可。
#
# CI 要点（2026-11 定稿）：
# 1) ubuntu-24.04 runner 不再预装 Android SDK —— 必须自己下载 cmdline-tools；
# 2) buildozer 在 ~/.buildozer/android/platform/android-sdk 期望旧版布局
#    （tools/bin/sdkmanager），需放软链接补位；
# 3) license 必须预接受（写 licenses/ 目录后 buildozer 自己的安装也不再弹窗）；
# 4) 固定 buildozer==1.5.0 + cython<3（p4a 2023 与 Cython 3 不兼容）。

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # 关键：固定 ubuntu-22.04。ubuntu-latest 已是 26.04，autoconf/libtool 太新，
    # p4a 的 libffi 老配方 autoreconf 会挂（AC_CANONICAL_SYSTEM 等 obsolete 宏不兼容）
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install buildozer (pinned)
        run: pip install "buildozer==1.5.0" "cython<3"

      - name: Pre-init buildozer SDK & accept licenses
        run: |
          set -x
          BSDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BSDK/cmdline-tools" /tmp/ct
          curl -sSLo /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools "$BSDK/cmdline-tools/latest"
          SDKM="$BSDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "build-tools;37.0.0" "platform-tools" "platforms;android-33" > /dev/null 2>&1 || true
          mkdir -p "$BSDK/tools/bin"
          ln -sf "$SDKM" "$BSDK/tools/bin/sdkmanager"
          echo "== 预装结果（应能看到 build-tools 目录含 37.0.0）=="
          ls "$BSDK"
          ls "$BSDK/build-tools" || true

      - name: Show environment
        run: |
          python -V
          pip show buildozer Cython | head -20

      - name: Build debug APK
        run: |
          if [ -f android_app/buildozer.spec ]; then cd android_app; fi
          ls -la
          buildozer version
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: videoplayerdl-apk
          path: |
            android_app/bin/*.apk
            bin/*.apk
          if-no-files-found: error
