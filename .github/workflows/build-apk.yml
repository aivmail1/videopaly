name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: ${{ env.HOME }}/.buildozer/android/platform/android-sdk
      ANDROIDSDK: ${{ env.HOME }}/.buildozer/android/platform/android-sdk
      ANDROIDNDK: ${{ env.HOME }}/.buildozer/android/platform/android-ndk-r25b
      ANDROIDAPI: "33"
      NDKAPI: "24"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            lld \
            openjdk-17-jdk

      - name: Install Rust toolchain (for cryptography)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Buildozer & SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.cargo/registry
          key: buildozer-sdk25b-api33-py311-${{ hashFiles('**/buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-sdk25b-api33-py311-
            buildozer-

      - name: Install buildozer & cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install "buildozer==1.5.0" "cython<3"

      - name: Pre-init Android SDK & accept licenses
        run: |
          set -euo pipefail
          BSDK="$ANDROID_HOME"
          if [ ! -d "$BSDK/cmdline-tools/latest" ]; then
            mkdir -p "$BSDK/cmdline-tools" /tmp/ct
            curl -sSLo /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/ct.zip -d /tmp/ct
            mv /tmp/ct/cmdline-tools "$BSDK/cmdline-tools/latest"
            rm -rf /tmp/ct /tmp/ct.zip
          fi
          SDKM="$BSDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "build-tools;33.0.2" "platform-tools" "platforms;android-33"
          mkdir -p "$BSDK/tools/bin"
          ln -sf "$SDKM" "$BSDK/tools/bin/sdkmanager"

      - name: Build debug APK
        run: |
          set -euo pipefail
          APP_DIR="."
          if [ -f "android_app/buildozer.spec" ]; then
            APP_DIR="android_app"
          fi
          cd "$APP_DIR"
          buildozer version
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: videoplayerdl-apk
          path: |
            android_app/bin/*.apk
            bin/*.apk
          if-no-files-found: error
