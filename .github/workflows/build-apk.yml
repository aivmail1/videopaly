# GitHub Actions：云端构建 APK（无需本地 Linux）
# 自适应：仓库根即本工程内容，或仓库根含 android_app/ 子目录，均可。
# 触发：push 到 main，或在 Actions 页手动 Run workflow。
#
# 版本策略（2026-11 调整）：
# - actions 升级到 v5（v4 已弃用告警）
# - 固定 buildozer==1.5.0 + Cython 0.29.x：python-for-android 2023 与
#   Cython 3 不兼容，"pip install buildozer cython" 拉到 Cython 3 会
#   早期立刻失败（正是 50 秒即挂的典型症状）

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install buildozer (pinned)
        run: pip install "buildozer==1.5.0" "cython<3"

      - name: Pre-init buildozer SDK & accept licenses
        run: |
          # 根因：buildozer 首跑时向“自己的 SDK 目录”装最新 build-tools 并要求
          # 交互接受 license，CI 里答不上来(默认 N)→ 组件被跳过→ aidl 缺失。
          # 解法：运行 buildozer 前，就在它专属的 SDK 路径里初始化 cmdline-tools、
          # 预接受全部 licenses、并把最新 build-tools 预装到位（37 就 37，已接受
          # 许可后 37 对 p4a 完全兼容）。buildozer 起来后发现组件齐了，直接过。
          BSDK="$HOME/.buildozer/android/platform/android-sdk"
          SYSTEM_SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SYSTEM_SDKM" ]; then
            SYSTEM_SDKM=$(find /usr/local/lib/android/sdk -name sdkmanager 2>/dev/null | head -1)
          fi
          mkdir -p "$BSDK"
          yes | "$SYSTEM_SDKM" --sdk_root="$BSDK" "cmdline-tools;latest" > /dev/null 2>&1 || true
          BSDKM="$BSDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$BSDKM" --licenses > /dev/null 2>&1 || true
          "$BSDKM" "build-tools;37.0.0" "platform-tools" "platforms;android-33" > /dev/null 2>&1 || true
          echo "== 预装结果 =="
          ls "$BSDK" || true
          ls "$BSDK/build-tools" || true

      - name: Show environment
        run: |
          python -V
          pip show buildozer Cython | head -20

      - name: Build debug APK
        run: |
          if [ -f android_app/buildozer.spec ]; then cd android_app; fi
          ls -la
          buildozer version
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: videoplayerdl-apk
          path: |
            android_app/bin/*.apk
            bin/*.apk
          if-no-files-found: error
