# GitHub Actions：云端构建 APK（无需本地 Linux）
# 自适应：仓库根即本工程内容，或仓库根含 android_app/ 子目录，均可。
# 触发：push 到 main，或在 Actions 页手动 Run workflow。

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Build debug APK
        run: |
          if [ -f android_app/buildozer.spec ]; then cd android_app; fi
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: videoplayerdl-apk
          path: |
            android_app/bin/*.apk
            bin/*.apk
